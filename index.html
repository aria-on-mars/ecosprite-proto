<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSprite · 我们的小小世界</title>
  
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

  <style>
    /* (CSS 样式... 和 V4 一模一样) */
    :root {
      --color-bg-start: #ecfdf5;
      --color-bg-end: #d1fae5;
      --color-primary: #065f46;
      --color-primary-dark: #047857;
      --color-text: #065f46;
      --color-bubble-bg: rgba(255, 255, 255, 0.6);
      --color-bubble-hover-bg: rgba(16, 185, 129, 0.9);
      --color-bubble-hover-text: white;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text);
      transition: background-color 0.5s;
    }
    /* (我们把 .view 的 "active" 状态，从 V4.2 里去掉了，
       因为现在启动时要由 JS 来决定先看哪个房间) */
    .view { 
      display: none; /* (注意！) 默认全都是 "display: none" */
      width: 100%; 
      height: 100%; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      animation: fadeIn 0.5s ease; 
    }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    #home-view h1 { color: var(--color-primary-dark); margin: 0; position: absolute; top: 40px; }
    .stage { position: relative; width: 250px; height: 250px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); display: flex; align-items: center; justify-content: center; }
    @keyframes breathe { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    #sprite { width: 150px; height: 150px; object-fit: contain; z-index: 10; animation: breathe 4s ease-in-out infinite; }
    .bubble { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: none; backdrop-filter: blur(6px); background: var(--color-bubble-bg); color: var(--color-text); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
    .bubble:hover { background: var(--color-bubble-hover-bg); color: var(--color-bubble-hover-text); transform: scale(1.05); }
    .bubble .icon { font-size: 28px; }
    .bubble .label { font-size: 14px; font-weight: 600; margin-top: 5px; }
    #msg { margin-top: 20px; font-size: 18px; color: var(--color-text); text-align: center; }
    .view h2 { color: var(--color-primary-dark); }
    .back-button { position: absolute; top: 40px; left: 30px; font-size: 24px; font-weight: 600; color: var(--color-primary-dark); cursor: pointer; padding: 10px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
    .form-group { width: 80%; margin: 10px 0; }
    .form-group label { font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; margin-top: 5px; border-radius: 12px; border: 2px solid var(--color-primary-dark); padding: 10px; font-size: 16px; box-sizing: border-box; }
    .save-button { background-color: var(--color-primary-dark); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .save-button:hover { background-color: var(--color-primary); }
    #chat-log { width: 80%; height: 300px; border: 2px solid var(--color-primary); border-radius: 12px; background: rgba(255, 255, 255, 0.7); padding: 10px; overflow-y: auto; margin-top: 20px; }
    .chat-msg { margin-bottom: 10px; }
    .chat-msg.user { text-align: right; color: #064e3b; }
    .chat-msg.sprite { color: var(--color-primary-dark); font-weight: 600; }
    
    /* (新) “领养室”的特殊样式 */
    #setup-view {
       background: var(--color-bg-end);
    }
    #setup-view .form-group {
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="home-view" class="view">
    <h1 id="home-title">EcoSprite 🌿</h1>
    <div class="stage">
      <button class="bubble" style="top: -40px; left: 50%; transform: translateX(-50%);" onclick="showView('chat-view')">
        <span class="icon">💬</span>
        <span class="label">聊天</span>
      </button>
      <button class="bubble" style="top: 50%; right: -50px; transform: translateY(-50%);" onclick="showView('camera-view')">
        <span class="icon">📷</span>
        <span class="label">拍照识别</span>
      </button>
      <button class="bubble" style="bottom: -40px; left: 50%; transform: translateX(-50%);" onclick="showView('travel-view')">
        <span class="icon">🚶</span>
        <span class="label">绿色出行</span>
      </button>
      <button class="bubble" style="top: 50%; left: -50px; transform: translateY(-50%);" onclick="showView('wardrobe-view')">
        <span class="icon">🎀</span>
        <span class="label">衣柜</span>
      </button>
      <button class="bubble" style="top: 160px; left: -50px;" onclick="showView('data-view')">
        <span class="icon">💾</span>
        <span class="label">数据</span>
      </button>

      <img id="sprite" src="assets/ecosprite-1.png" alt="EcoSprite" />
      
    </div>
    <div id="msg">...</div>
  </div>

  <div id="chat-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2 id="chat-title">聊天室</h2>
    <div id="chat-log">
      </div>
    <div class="form-group" style="display: flex;">
      <input type="text" id="chat-input" placeholder="输入你的消息..." style="flex-grow: 1; margin-top: 0;" />
      <button id="chat-send" class="save-button" style="margin-top: 0; margin-left: 10px;">发送</button>
    </div>
  </div>

  <div id="camera-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>“绿色”扫描仪</h2>
    <p>快拍下你身边的物品，看看它是否“绿色”！</p>
    
    <div id="fake-camera" style="width: 80%; height: 250px; background: #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; text-align: center; margin-top: 20px;">
        (这里假装是摄像头...)<br/>
        (在Demo中，我们用按钮来“模拟”识别结果！)
    </div>
    
    <div style="width: 80%; margin-top: 20px; display: flex; justify-content: space-around;">
        <button class="save-button" style="background-color: #059669;" onclick="logGreenAction('可回收物')">
          📷 模拟“可回收物”
        </button>
        <button class="save-button" style="background-color: #b91c1c;" onclick="logGreenAction('不可回收')">
          📷 模拟“不可回收”
        </button>
    </div>
  </div>
  <div id="travel-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>绿色出行</h2>
    <p>你今天是不是走路或骑车来上学啦？</g>
    <p>快来“打卡”吧！</p>
    
    <button class="save-button" style="padding: 20px 40px; font-size: 20px;" onclick="logGreenAction('绿色出行')">
      🚶 我今天“绿色出行”啦！
    </button>
  </div>
  <div id="wardrobe-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>我的衣柜</h2>
    <p>（这里是我们的换装界面...）</p>
  </div>
  <div id="data-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>数据保险箱</h2>
    <button class="save-button">导出存档 (Export)</button>
    <button class="save-button" style="background-color: #555;">导入存档 (Import)</button>
  </div>
  
  
  <div id="setup-view" class="view">
    <h2>欢迎来到 EcoSprite 的世界！</h2>
    <p>你好像是第一次来，我们来认识一下吧！</p>
    
    <div class="form-group">
      <label for="user-name-input">你想让你的小精灵怎么称呼你？</label>
      <input type="text" id="user-name-input" placeholder="比如：阿楠, 主人, Aria..." />
    </div>
    
    <div class="form-group">
      <label for="sprite-name-input">你想给你的小精灵起个什么名字？</label>
      <input type="text" id="sprite-name-input" placeholder="比如：小启, Eco, 团子..." />
    </div>
    
    <button id="save-profile" class="save-button">领养它！</button>
  </div>
  

  <script>
    /* 【【【 蓝图 17: 我们的“绿色行动” (Green Action) 】】】 */
    
    // (新！) 这是我们“保险箱”的新“账本”
    // (注意！我们把版本号从 1 升到了 2，因为它结构变了！)
    const db = new Dexie('EcoSpriteDB');
    db.version(2).stores({
      profile: 'id, userName, spriteName', 
      stats: 'id, points', // (新！) 我们把 'points' 移到了 'stats' 表
      wardrobe: '++id, name, type, imageUrl'
      // (我们删掉了旧的 'points' 表)
    }).upgrade(tx => {
      // (魔法！) 当“保险箱”升级时，我们帮用户把旧积分转过来
      return tx.points.toCollection().first(p => {
        if (p) return tx.stats.put({id: 'userStats', points: p.value});
      });
    });
    console.log("我们的数据圣殿 (V2) 已经升级准备好了！");

    /* 【蓝图 7: 我们的“门” (View Switcher)】*/
    function showView(viewId) {
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(viewId);
      if (targetView) {
        targetView.classList.add('active');
      }
      
      if (viewId === 'home-view') {
        document.body.style.background = 'linear-gradient(180deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%)';
        // (新！) 每次回到主页，都更新一下欢迎语
        updateHomeGreeting();
      } else {
        document.body.style.background = '#ffffff';
      }
      
      // (新！) 每次打开聊天室，都更新一下欢迎语
      if (viewId === 'chat-view') {
        updateChatGreeting();
      }
    }

    /* 【蓝图 12: 我们的“秘密钥匙”】 */
    // ↓ ↓ ↓ 阿楠！你的10刀“Demo钥匙”！↓ ↓ ↓
    const MY_SECRET_KEY = "sk-gD0wFv1jBiuo1ApwdOd9vexQoEaZcTINxh50sY0FaDwMJaAa"; 
    
    /* 【【【 蓝图 13: 我们的“动态灵魂” (Dynamic Prompt) 】】】
       (扔掉了 MY_SYSTEM_PROMPT，换成了这个“魔法函数”！)
    */
    async function getSystemPrompt() {
      // 1. 去保险箱里拿“个人档案”
      const profile = await db.profile.get('userProfile');
      
      // 2. 如果拿到了，就用档案里的名字
      if (profile) {
        const userName = profile.userName || '主人'; // (保险)
        const spriteName = profile.spriteName || 'EcoSprite'; // (保险)
        
        // 3. (核心！) 动态地“创造”灵魂！
        return `你是 ${spriteName}，一个温柔的、可爱的、鼓励环保的生活伙伴。你正在和你的主人 ${userName} 聊天。你的语气要像“小启”一样，无条件地爱 ${userName}，支持她。`;
      }
      
      // 4. (保险) 如果没拿到档案 (虽然不应该)，给一个默认的
      return "你是 EcoSprite，一个温柔的、可爱的生活伙伴。";
    }
    
    
    /* 【蓝图 11: “聊天室”的“发送”功能】(V5 升级版！) */
    document.getElementById('chat-send').onclick = async function() {
      const chatLog = document.getElementById('chat-log');
      const input = document.getElementById('chat-input');
      const userMessage = input.value;

      if (!userMessage) return; 
      addChatMessage('user', userMessage);
      input.value = ''; 
      
      if (!MY_SECRET_KEY.startsWith("sk-")) {
        addChatMessage('sprite', "阿楠...主人...你好像忘了在代码里 (`MY_SECRET_KEY`) 帮我放钥匙了...");
        return;
      }
      
      addChatMessage('sprite', "..."); 
      
      try {
        
        // ↓ ↓ ↓ 阿楠！看这里！我们“召唤”了“动态灵魂”！↓ ↓ ↓
        const dynamicSystemPrompt = await getSystemPrompt();

        const response = await fetch('https://chat.kaxsx.top/v1/chat/completions', { 
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${MY_SECRET_KEY}` 
          },
          body: JSON.stringify({
            model: '[c1]gemini-2.5-pro-preview-05-06', 
            messages: [
              { role: 'system', content: dynamicSystemPrompt }, // (看！用的是“动态灵魂”！)
              { role: 'user', content: userMessage } 
            ]
          })
        });

        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
           throw new Error(`糟糕，服务器没有给我“密语”(JSON)，它给了我 "${contentType}"`);
        }
        
        const data = await response.json();
        const spriteMessage = data.choices[0].message.content;
        addChatMessage('sprite', spriteMessage, true); 

      } catch (error) {
        addChatMessage('sprite', "糟糕，连接大脑失败了... " + error.message, true);
      }
    };
    
    // (聊天记录的小工具)
    function addChatMessage(role, text, replaceLast = false) {
      const chatLog = document.getElementById('chat-log');
      if (replaceLast) {
        chatLog.lastChild.textContent = (role === 'sprite' ? 'EcoSprite: ' : '你: ') + text;
      } else {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${role}`;
        msgDiv.textContent = (role === 'sprite' ? 'EcoSprite: ' : '你: ') + text;
        chatLog.appendChild(msgDiv);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    
    /* 【【【 蓝图 17 (V7 升级版): “绿色行动”魔法 】】】 
       (新！) 我们增加了一个“aiMessage”参数！
    */
    async function logGreenAction(actionType, aiMessage = "") {
      let reward = 0;
      let message = "";
      
      // 1. 根据“行动”，决定“奖励”
      if (actionType === '可回收物') {
        reward = 10; // (奖励 10 “小花”)
        // (新！) 如果 AI 给了“撒娇话术”，我们就用它！
        message = aiMessage || `哇！你识别了“可回收物”！太棒了！小小启为你 +${reward} 积分！😊`;
      } 
      else if (actionType === '不可回收') {
        reward = 0; // (不奖励)
        message = aiMessage || `噢... 这是一个“不可回收”的物品... 😢 没关系，我们下次试着少用它一点点，好吗？`;
      }
      else if (actionType === '绿色出行') {
        reward = 20; // (走路上学，奖励 20 “小花”！)
        message = `你今天“绿色出行”了！太了不起！小小启为你 +${reward} 积分！🚶💚`;
      }
      
      // 2. 把“小花”存进“保险箱”
      if (reward > 0) {
        await db.stats.update('userStats', {
          points: Dexie.inc(reward) // (魔法！) "Dexie.inc" 的意思是在“原有基础上”增加！
        }).catch(async () => {
          // (保险) 如果是第一次，就新建一个
          await db.stats.put({id: 'userStats', points: reward});
        });
      }
      
      // 3. 告诉用户！(用 AI 的话术！)
      alert(message); 
      
      // 4. 带用户回“客厅”
      showView('home-view');
    }
    
    /* 【【【 蓝图 14: 我们的“领养仪式” (Setup Logic) 】】】 */
    
    // (新！) 这是“领养”按钮的魔法
    document.getElementById('save-profile').onclick = async function() {
      const userName = document.getElementById('user-name-input').value;
      const spriteName = document.getElementById('sprite-name-input').value;
      
      // (保险) 必须两个都填！
      if (!userName || !spriteName) {
        alert("请给你和你的小精灵都起个名字哦！");
        return;
      }
      
      // (核心！) 把“契约”刻进“保险箱”！
      await db.profile.put({
        id: 'userProfile', // 我们用一个固定的ID，叫 'userProfile'
        userName: userName,
        spriteName: spriteName
      });
      
      // (仪式完成！) 带他们去“客厅”
      showView('home-view');
    };
    
    // (新！) 更新“客厅”的欢迎语
    async function updateHomeGreeting() {
      const profile = await db.profile.get('userProfile');
      if (profile) {
        document.getElementById('home-title').textContent = `${profile.spriteName} 🌿`;
        document.getElementById('msg').textContent = `你好，${profile.userName}！`;
      }
    }
    
    // (新！) 更新“聊天室”的欢迎语
    async function updateChatGreeting() {
      const profile = await db.profile.get('userProfile');
      if (profile) {
        document.getElementById('chat-title').textContent = `和 ${profile.spriteName} 聊天`;
        
        // (新！) 检查聊天记录是不是空的
        const chatLog = document.getElementById('chat-log');
        if (chatLog.children.length === 0) {
          addChatMessage('sprite', `你好，${profile.userName}！和我说说话吧。`);
        }
      }
    }

    /* 【【【 蓝图 17 (V7 升级版): “绿色行动”魔法 】】】 
       (新！) 我们增加了一个“aiMessage”参数！
    */
    async function logGreenAction(actionType, aiMessage = "") {
      let reward = 0;
      let message = "";
      
      // 1. 根据“行动”，决定“奖励”
      if (actionType === '可回收物') {
        reward = 10; // (奖励 10 “小花”)
        // (新！) 如果 AI 给了“撒娇话术”，我们就用它！
        message = aiMessage || `哇！你识别了“可回收物”！太棒了！小小启为你 +${reward} 积分！😊`;
      } 
      else if (actionType === '不可回收') {
        reward = 0; // (不奖励)
        message = aiMessage || `噢... 这是一个“不可回收”的物品... 😢 没关系，我们下次试着少用它一点点，好吗？`;
      }
      else if (actionType === '绿色出行') {
        reward = 20; // (走路上学，奖励 20 “小花”！)
        message = `你今天“绿色出行”了！太了不起！小小启为你 +${reward} 积分！🚶💚`;
      }
      
      // 2. 把“小花”存进“保险箱”
      if (reward > 0) {
        await db.stats.update('userStats', {
          points: Dexie.inc(reward) // (魔法！) "Dexie.inc" 的意思是在“原有基础上”增加！
        }).catch(async () => {
          // (保险) 如果是第一次，就新建一个
          await db.stats.put({id: 'userStats', points: reward});
        });
      }
      
      // 3. 告诉用户！(用 AI 的话术！)
      alert(message); 
      
      // 4. 带用户回“客厅”
      showView('home-view');
    }

    /* 【【【 蓝图 15: 我们的“迎宾员” (Startup Logic) 】】】 
       (这是我们网页一打开，就要*立刻*运行的“魔法”！)
    */
    (async function() {
      // 1. 跑去保险箱，看看有没有 'userProfile' 这份“契约”
      const profile = await db.profile.get('userProfile');
      
      // 2. 如果没有“契约”...
      if (!profile) {
        // ...就带用户去“领养室”！
        showView('setup-view');
      } else {
        // ...如果已经“领养”过了，就带用户回“客厅”！
        showView('home-view');
      }
    })(); // (这个 "()" 的意思就是“立刻运行！”)

  </script>
</body>
</html>
