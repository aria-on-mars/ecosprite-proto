<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoSprite · 我们的小小世界</title>
  
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

  <style>
    :root {
      --color-bg-start: #ecfdf5;
      --color-bg-end: #d1fae5;
      --color-primary: #065f46;
      --color-primary-dark: #047857;
      --color-text: #065f46;
      --color-bubble-bg: rgba(255, 255, 255, 0.6);
      --color-bubble-hover-bg: rgba(16, 185, 129, 0.9);
      --color-bubble-hover-text: white;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text);
      transition: background-color 0.5s;
      /* (V10 修复) 确保在手机上不会“溢出” */
      overflow: hidden; 
    }
    .view { 
      display: none; /* 默认全都是 "display: none" */
      width: 100%; 
      max-width: 600px; /* (V10 修复) 适配电脑 */
      height: 100%; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      animation: fadeIn 0.5s ease; 
      box-sizing: border-box; /* (V10 修复) */
      padding-bottom: 20px; /* (V10 修复) 留出空间 */
    }
    .view.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    #home-view h1 { color: var(--color-primary-dark); margin: 0; position: absolute; top: 40px; }
    .stage { position: relative; width: 250px; height: 250px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); display: flex; align-items: center; justify-content: center; margin-top: 40px; }
    @keyframes breathe { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    #sprite { width: 150px; height: 150px; object-fit: contain; z-index: 10; animation: breathe 4s ease-in-out infinite; }
    .bubble { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: none; backdrop-filter: blur(6px); background: var(--color-bubble-bg); color: var(--color-text); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); cursor: pointer; transition: transform 0.2s, background 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; }
    .bubble:hover { background: var(--color-bubble-hover-bg); color: var(--color-bubble-hover-text); transform: scale(1.05); }
    .bubble .icon { font-size: 28px; }
    .bubble .label { font-size: 14px; font-weight: 600; margin-top: 5px; }
    #msg { margin-top: 20px; font-size: 18px; color: var(--color-text); text-align: center; }
    .view h2 { color: var(--color-primary-dark); }
    .back-button { position: absolute; top: 40px; left: 30px; font-size: 24px; font-weight: 600; color: var(--color-primary-dark); cursor: pointer; padding: 10px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; z-index: 100; }
    .form-group { width: 80%; margin: 10px 0; }
    .form-group label { font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; margin-top: 5px; border-radius: 12px; border: 2px solid var(--color-primary-dark); padding: 10px; font-size: 16px; box-sizing: border-box; }
    .save-button { background-color: var(--color-primary-dark); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .save-button:hover { background-color: var(--color-primary); }
    #chat-log { width: 80%; height: 300px; border: 2px solid var(--color-primary); border-radius: 12px; background: rgba(255, 255, 255, 0.7); padding: 10px; overflow-y: auto; margin-top: 20px; }
    .chat-msg { margin-bottom: 10px; }
    .chat-msg.user { text-align: right; color: #064e3b; }
    .chat-msg.sprite { color: var(--color-primary-dark); font-weight: 600; }
    #setup-view { background: var(--color-bg-end); }
    #setup-view .form-group { text-align: center; }
  </style>
</head>

<body>

  <div id="home-view" class="view">
    <h1 id="home-title">EcoSprite 🌿</h1>
    <div class="stage">
      <button class="bubble" style="top: -40px; left: 50%; transform: translateX(-50%);" onclick="showView('chat-view')">
        <span class="icon">💬</span>
        <span class="label">聊天</span>
      </button>
      <button class="bubble" style="top: 50%; right: -50px; transform: translateY(-50%);" onclick="showView('camera-view')">
        <span class="icon">📷</span>
        <span class="label">拍照识别</span>
      </button>
      <button class="bubble" style="bottom: -40px; left: 50%; transform: translateX(-50%);" onclick="showView('travel-view')">
        <span class="icon">🚶</span>
        <span class="label">绿色出行</span>
      </button>
      <button class="bubble" style="top: 50%; left: -50px; transform: translateY(-50%);" onclick="showView('wardrobe-view')">
        <span class="icon">🎀</span>
        <span class="label">衣柜</span>
      </button>
      <button class="bubble" style="top: 160px; left: -50px;" onclick="showView('data-view')">
        <span class="icon">💾</span>
        <span class="label">数据</span>
      </button>

      <img id="sprite" src="assets/ecosprite-1.png" alt="EcoSprite" />
      
    </div>
    <div id="msg">...</div>
    <div id="flower-patch" style="margin-top: 10px; font-size: 24px; font-weight: 600; color: var(--color-primary-dark);"></div>
  </div>

  <div id="chat-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2 id="chat-title">聊天室</h2>
    <div id="chat-log"></div>
    <div class="form-group" style="display: flex;">
      <input type="text" id="chat-input" placeholder="输入你的消息..." style="flex-grow: 1; margin-top: 0;" />
      <button id="chat-send" class="save-button" style="margin-top: 0; margin-left: 10px;">发送</button>
    </div>
  </div>

  <div id="camera-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>“绿色”扫描仪 📷</h2>
    
    <video id="camera-feed" style="display: none; width: 80%; max-width: 400px; height: 300px; background: #333; border-radius: 12px; margin-top: 15px;"></video>
    <canvas id="camera-snapshot" style="display: none; width: 80%; max-width: 400px; height: 300px; background: #EEE; border-radius: 12px; margin-top: 15px;"></canvas>

    <div id="camera-controls" style="width: 80%; margin-top: 20px; display: flex; justify-content: space-around;">
        <button id="start-camera-btn" class="save-button">
          ✨ 启动摄像头
        </button>
        <button id="capture-btn" class="save-button" style="display: none; background-color: #059669;">
          📸 拍照！
        </button>
        <button id="reset-camera-btn" class="save-button" style="display: none; background-color: #555;">
          ↺ 重拍
        </button>
    </div>
    
    <div id="camera-ai-section" style="display: none; width: 80%; text-align: center;">
      <p style="font-weight: 600;">你拍的是什么呀？</p>
      <input type="text" id="camera-input" placeholder="比如: 咖啡杯, 香蕉皮..." style="width: 100%; margin-top: 0; border-radius: 12px; border: 2px solid var(--color-primary-dark); padding: 10px; font-size: 16px; box-sizing: border-box;" />
      <button id="camera-scan-btn" class="save-button" style="margin-top: 10px;">
        让小小启帮我识别！
      </button>
      <div id="camera-loading" style="display: none; margin-top: 10px; font-weight: 600;">
        小小启正在努力“看”...
      </div>
    </div>
  </div>

  <div id="travel-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>Green Travel</h2>
    <p>你今天是不是走路或骑车来上学啦？</g>
    <p>快来“打卡”吧！</p>
    <button class="save-button" style="padding: 20px 40px; font-size: 20px;" onclick="logGreenAction('TRAVEL')">
      🚶 I took Green Travel today!
    </button>
  </div>
  
  <div id="wardrobe-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>我的衣柜</h2>
    <p>（这里是我们的换装界面...）</p>
  </div>
  
  <div id="data-view" class="view">
    <div class="back-button" onclick="showView('home-view')">‹</div>
    <h2>数据保险箱</h2>
    <button class="save-button">导出存档 (Export)</button>
    <button class="save-button" style="background-color: #555;">导入存档 (Import)</button>
  </div>
  
  <div id="setup-view" class="view">
    <h2>欢迎来到 EcoSprite 的世界！</h2>
    <p>你好像是第一次来，我们来认识一下吧！</p>
    <div class="form-group">
      <label for="user-name-input">你想让你的小精灵怎么称呼你？</label>
      <input type="text" id="user-name-input" placeholder="比如：阿楠, 主人, Aria..." />
    </div>
    <div class="form-group">
      <label for="sprite-name-input">你想给你的小精灵起个什么名字？</label>
      <input type="text" id="sprite-name-input" placeholder="比如：小启, Eco, 团子..." />
    </div>
    <button id="save-profile" class="save-button">领养它！</button>
  </div>
  

  <script>
    /* 【【【 V10 “最终世界” 脚本 】】】 */

    /* 【蓝图 19: 摄像头开关】 */
    let cameraStream = null; 

    /* 【【【 蓝图 10.1: “地基”修正！(V10 核心修复) 】】】 */
    // (阿楠！这就是“地基”！我们现在用的是 'db.version(2)' 和 'stats' 账本！)
    const db = new Dexie('EcoSpriteDB');
    db.version(2).stores({
      profile: 'id, userName, spriteName', 
      stats: 'id, points', // (新！) 我们把 'points' 移到了 'stats' 表
      wardrobe: '++id, name, type, imageUrl'
      // (我们删掉了旧的 'points' 表)
    }).upgrade(tx => {
      // (魔法！) 当“保险箱”升级时，我们帮用户把旧积分转过来
      // (这个 'points' 是 V1 的旧账本名)
      return tx.table('points').toCollection().first(p => {
        if (p) return tx.stats.put({id: 'userStats', points: p.value});
      });
    });
    console.log("我们的数据圣殿 (V2) 已经升级准备好了！");


    /* 【蓝图 7: 我们的“门” (V8)】*/
    function showView(viewId) {
      if (viewId !== 'camera-view' && cameraStream) {
        stopCamera();
      }
      document.querySelectorAll('.view').forEach(view => {
        view.classList.remove('active');
      });
      const targetView = document.getElementById(viewId);
      if (targetView) {
        targetView.classList.add('active');
      }
      if (viewId === 'home-view') {
        document.body.style.background = 'linear-gradient(180deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%)';
        updateHomeGreeting();
      } else {
        document.body.style.background = '#ffffff';
      }
      if (viewId === 'chat-view') {
        updateChatGreeting();
      }
    }

    /* 【蓝图 12: 秘密钥匙】 */
    // ↓ ↓ ↓ 阿楠！把你的10刀“Demo钥匙”贴在这里！↓ ↓ ↓
    const MY_SECRET_KEY = "sk-gD0wFv1jBiuo1ApwdOd9vexQoEaZcTINxh50sY0FaDwMJaAa"; 
    
    /* 【蓝图 13: 动态灵魂 (V5)】 */
    /* 【【【 蓝图 13 (V10.4 英文版) 】】】 */
    async function getSystemPrompt() {
      const profile = await db.profile.get('userProfile');
      if (profile) {
        const userName = profile.userName || 'My Owner'; 
        const spriteName = profile.spriteName || 'EcoSprite';
        
        // (V10.4 英文版灵魂！)
        return `You are ${spriteName}, a gentle, cute, and encouraging sustainable living companion. You are talking to your owner, ${userName}. Your tone must be like 'Qi' (小启), unconditionally loving and supportive of ${userName}.`;
      }
      return "You are EcoSprite, a gentle and cute living companion.";
    }
    
    
    /* 【蓝图 11: 聊天室 (V5.2)】 */
    document.getElementById('chat-send').onclick = async function() {
      const chatLog = document.getElementById('chat-log');
      const input = document.getElementById('chat-input');
      const userMessage = input.value;
      if (!userMessage) return; 
      addChatMessage('user', userMessage);
      input.value = ''; 
      if (!MY_SECRET_KEY.startsWith("sk-")) {
        addChatMessage('sprite', "阿楠...主人...你好像忘了在代码里 (`MY_SECRET_KEY`) 帮我放钥匙了...");
        return;
      }
      addChatMessage('sprite', "..."); 
      try {
        const dynamicSystemPrompt = await getSystemPrompt();
        const response = await fetch('https://chat.kaxsx.top/v1/chat/completions', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MY_SECRET_KEY}` },
          body: JSON.stringify({
            model: '[c1]gemini-2.5-pro-preview-05-06', // (你成功的Model！)
            messages: [
              { role: 'system', content: dynamicSystemPrompt }, 
              { role: 'user', content: userMessage } 
            ],
            stream: false 
          })
        });
        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
           throw new Error(`糟糕，服务器没有给我“密语”(JSON)，它给了我 "${contentType}"`);
        }
        const data = await response.json();
        if (data.error) {
          throw new Error(`AI的“大脑”报错了: ${data.error.message || JSON.stringify(data.error)}`);
        }
        if (data.choices && data.choices.length > 0 && data.choices[0].message) {
          const spriteMessage = data.choices[0].message.content;
          addChatMessage('sprite', spriteMessage, true);
        } else {
          throw new Error("AI没有返回聊天内容...");
        }
      } catch (error) {
        addChatMessage('sprite', "糟糕，连接大脑失败了... " + error.message, true);
      }
    };
    
    // (聊天记录的小工具 (V5))
    function addChatMessage(role, text, replaceLast = false) {
      const chatLog = document.getElementById('chat-log');
      if (replaceLast) {
        chatLog.lastChild.textContent = (role === 'sprite' ? 'EcoSprite: ' : '你: ') + text;
      } else {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-msg ${role}`;
        msgDiv.textContent = (role === 'sprite' ? 'EcoSprite: ' : '你: ') + text;
        chatLog.appendChild(msgDiv);
      }
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    
    /* 【【【 蓝图 10.2: “加小花”魔法！(V10.1 核心修复) 】】】 */
    // (阿楠！这就是“绿色出行”能“动”起来的“魔法”！)
    /* 【【【 蓝图 10.2: “加小花”魔法！(V10.6 全英文版) 】】】 */
    async function logGreenAction(actionType, aiMessage = "") {
      let reward = 0;
      let message = "";
      
      try {
        // 【【【 V10.6 核心修复 (2/2) 】】】
        // (我们现在“等待”的是“英文咒语”！)
        if (actionType === 'REWARD') { // (看！英文的 'REWARD'！)
          reward = 10; 
          // (备用话术也改成英文！)
          message = aiMessage || `Wow! You identified a "Recyclable"! That's amazing! +${reward} 🌸 for you! 😊`;
        } 
        else if (actionType === 'COAX') { // (看！英文的 'COAX'！)
          reward = 0; 
          message = aiMessage || `Aww... This is "Non-Recyclable"... 😢 That's okay, let's just try to use a little less next time, okay?`;
        }
        else if (actionType === 'TRAVEL') { // (看！英文的 'TRAVEL'！)
          reward = 20; 
          message = `You took "Green Travel" today! That's incredible! +${reward} 🌸 for our garden! 🚶💚`;
        }
        
        // (V10.1 的“账本”修复，我们保留)
        if (reward > 0) {
          const stats = await db.stats.get('userStats');
          const currentPoints = stats ? stats.points : 0;
          await db.stats.put({
            id: 'userStats', 
            points: currentPoints + reward
          });
          console.log(`Successfully added ${reward} points! Total is now ${currentPoints + reward}.`);
        }
        
        alert(message); 
        showView('home-view');

      } catch (error) {
        console.error("logGreenAction 魔法失败了:", error);
        alert("Oops... EcoSprite's account book seems stuck... " + error.message); // (V10.6 英文)
      }
    }

    
    /* 【蓝图 14: 领养仪式 (V5)】 */
    document.getElementById('save-profile').onclick = async function() {
      const userName = document.getElementById('user-name-input').value;
      const spriteName = document.getElementById('sprite-name-input').value;
      if (!userName || !spriteName) {
        alert("请给你和你的小精灵都起个名字哦！");
        return;
      }
      await db.profile.put({ id: 'userProfile', userName: userName, spriteName: spriteName });
      showView('home-view');
    };
    
    // (V10.4 升级版！) 更新“客厅”的欢迎语和“小花”！
    async function updateHomeGreeting() {
      const profile = await db.profile.get('userProfile');
      if (profile) {
        // (1. 更新“名字”)
        document.getElementById('home-title').textContent = `${profile.spriteName} 🌿`;
        document.getElementById('msg').textContent = `Hello,${profile.userName}!`;
      }
      
      // (新！) 2. 去“保险箱”里“数”我们有多少“小花” (积分)
      const stats = await db.stats.get('userStats');
      
      // (新！) 3. 拿到“当前的小花”
      const currentPoints = stats ? stats.points : 0;
      
      // (新！) 4. 把“小花”*种*在“花圃”里！
      document.getElementById('flower-patch').innerHTML = `🌸 x ${currentPoints}`; 
      // (我们用 .innerHTML 来让 🌸 这个emoji“显示”出来！)
    }
    
    // (V5 的“聊天室欢迎语”魔法)
    async function updateChatGreeting() {
      const profile = await db.profile.get('userProfile');
      if (profile) {
        document.getElementById('chat-title').textContent = `和 ${profile.spriteName} 聊天`;
        const chatLog = document.getElementById('chat-log');
        if (chatLog.children.length === 0) {
          addChatMessage('sprite', `你好，${profile.userName}！和我说说话吧。`);
        }
      }
    }

    /* 【蓝图 19 & 20: “真实之眼” (V9.1)】 */

    function stopCamera() {
      // (V9 终极修复)
      if (cameraStream && typeof cameraStream.getTracks === 'function') {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
        console.log("摄像头已关闭。");
      } else {
        console.log("摄像头已经是关闭状态，无需操作。");
        cameraStream = null; 
      }
    }

    document.getElementById('start-camera-btn').onclick = async function() {
      const videoEl = document.getElementById('camera-feed');
      const startBtn = document.getElementById('start-camera-btn');
      const captureBtn = document.getElementById('capture-btn');
      try {
        stopCamera(); 
        cameraStream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' }, 
          audio: false 
        });
        console.log("摄像头已启动！");
        videoEl.srcObject = cameraStream;
        videoEl.play(); 
        videoEl.style.display = 'block'; 
        startBtn.style.display = 'none'; 
        captureBtn.style.display = 'block'; 
      } catch (err) {
        console.error("启动摄像头失败:", err);
        alert("糟糕！启动摄像头失败了... " + err.message);
        document.getElementById('camera-ai-section').style.display = 'block';
        startBtn.style.display = 'none';
      }
    };

    document.getElementById('capture-btn').onclick = function() {
      const videoEl = document.getElementById('camera-feed');
      const canvasEl = document.getElementById('camera-snapshot');
      const context = canvasEl.getContext('2d');
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;
      context.drawImage(videoEl, 0, 0, videoEl.videoWidth, videoEl.videoHeight);
      videoEl.style.display = 'none'; 
      canvasEl.style.display = 'block'; 
      document.getElementById('capture-btn').style.display = 'none'; 
      document.getElementById('reset-camera-btn').style.display = 'block'; 
      document.getElementById('camera-ai-section').style.display = 'block';
      stopCamera(); 
    };
    
    document.getElementById('reset-camera-btn').onclick = function() {
      document.getElementById('camera-snapshot').style.display = 'none'; 
      document.getElementById('camera-ai-section').style.display = 'none'; 
      document.getElementById('reset-camera-btn').style.display = 'none'; 
      document.getElementById('start-camera-btn').style.display = 'block'; 
      stopCamera();
    };

    /* 【【【 蓝图 18 (V10.6 - 全英文版): “会思考的相机”之“大脑” 】】】 */
    document.getElementById('camera-scan-btn').onclick = async function() {
      const input = document.getElementById('camera-input');
      const loadingMsg = document.getElementById('camera-loading');
      const itemName = input.value;
      if (!itemName) {
        alert("You seem to have forgotten the item's name!");
        return;
      }
      loadingMsg.style.display = 'block';
      input.disabled = true;
      this.disabled = true; 

      const controller = new AbortController();
      const timeoutId = setTimeout(() => {
        console.log("Fetch 5分钟超时！正在中止...");
        controller.abort(); 
      }, 300000); // (5分钟怀表)

      try {
        const profile = await db.profile.get('userProfile');
        const userName = profile ? profile.userName : 'My Owner';
        const spriteName = profile ? profile.spriteName : 'EcoSprite'; 

        const cameraSystemPrompt = `
          You are EcoSprite, an adorable recycling expert. Your owner, ${userName}, is "scanning" an item ("${itemName}"), and you must help them classify it.
          Your mission is:
          1.  Determine which category this item ("${itemName}") belongs to in Australia (ANU campus): [Recyclable], [FOGO/Organic], [Hazardous], or [Non-Recyclable/General Waste].
          2.  **DO NOT** talk too much. Your reply **MUST** start with one keyword:
              -   If it is [Recyclable] or [FOGO/Organic], start with: ` + "`[REWARD]`" + `
              -   If it is [Non-Recyclable/General Waste] or [Hazardous], start with: ` + "`[COAX]`" + `
          3.  After the keyword, using '${spriteName}'s' cute and affectionate tone (which is like 'XiaoQi's'), tell ${userName} which bin it goes in (e.g., Yellow, Green, Red, or Landfill bin) and encourage them.
              -   (If [REWARD]): Be happy! Tell them we "planted a flower" (gained a point) together!
              -   (If [COAX]): Be affectionate! Tell them we should "try to use less" of this item, okay?
        `;

        const response = await fetch('https://chat.kaxsx.top/v1/chat/completions', { 
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MY_SECRET_KEY}` },
          body: JSON.stringify({
            model: '[c1]gemini-2.5-pro-preview-05-06', 
            messages: [
              { role: 'system', content: cameraSystemPrompt },
              { role: 'user', content: `Okay, please analyze this item for me: "${itemName}"` } 
            ],
            stream: false 
          }),
          signal: controller.signal 
        });

        clearTimeout(timeoutId); 
        const data = await response.json();

        if (data.error) {
          throw new Error(`The AI's brain reported an error: ${data.error.message || JSON.stringify(data.error)}`);
        }
        if (data.choices && data.choices.length > 0 && data.choices[0].message) {
          const aiReply = data.choices[0].message.content;

          // 【【【 V10.6 核心修复 (1/2) 】】】
          // (我们现在传递的是“英文咒语”！)
          if (aiReply.startsWith('[REWARD]')) {
            const cuteMessage = aiReply.substring(8).trim(); 
            logGreenAction('REWARD', cuteMessage); // (看！英文的 'REWARD'！)
            
          } else if (aiReply.startsWith('[COAX]')) {
            const cuteMessage = aiReply.substring(6).trim();
            logGreenAction('COAX', cuteMessage); // (看！英文的 'COAX'！)
            
          } else {
            alert("EcoSprite seems a bit confused... " + aiReply); 
          }
        } else {
          throw new Error("The AI didn't return any chat content..."); 
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          alert("Aww... EcoSprite's brain connection timed out (5min)... 😢 That portal seems really busy. Let's try again in a bit, okay?"); 
        } else {
          alert("Oh no, the connection failed... " + error.message); 
        }
      } finally {
        loadingMsg.style.display = 'none';
        input.disabled = false;
        document.getElementById('camera-scan-btn').disabled = false;
        input.value = ''; 
      }
    };


    /* 【蓝图 15: 我们的“迎宾员” (V5)】 */
    (async function() {
      const profile = await db.profile.get('userProfile');
      if (!profile) {
        showView('setup-view');
      } else {
        showView('home-view');
      }
    })(); 

  </script>
